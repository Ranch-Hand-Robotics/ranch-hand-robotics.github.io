---
layout: default
---

<style>
  /* Full-width page layout - no constraints */
  .page-full-width {
    width: 100%;
    max-width: 100%;
    padding: 0;
    margin: 0;
  }

  .page-wrapper {
    width: 100%;
    padding: 60px 20px;
    margin: 0 auto;
  }

  .page-wrapper > h1:first-child {
    font-size: clamp(2.5rem, 7vw, 4rem);
    font-weight: 900;
    margin-bottom: 2rem;
    color: #4CAF50;
    text-align: center;
  }

  .page-content {
    max-width: 1200px;
    margin: 0 auto;
  }

  .page-content h2 {
    font-size: clamp(1.8rem, 5vw, 2.8rem);
    font-weight: 800;
    margin-top: 3rem;
    margin-bottom: 1.5rem;
    color: #4CAF50;
  }

  .page-content h3 {
    font-size: clamp(1.3rem, 3vw, 1.8rem);
    font-weight: 700;
    margin-top: 2rem;
    margin-bottom: 1rem;
    color: #66BB6A;
  }

  .page-content p,
  .page-content li {
    font-size: clamp(1rem, 1.1vw, 1.1rem);
    line-height: 1.8;
    color: rgba(255, 255, 255, 0.85);
    margin-bottom: 1.5rem;
  }

  .page-content ul,
  .page-content ol {
    margin-left: 2rem;
    margin-bottom: 1.5rem;
  }

  .page-content li {
    margin-bottom: 0.8rem;
  }

  .page-content strong {
    color: #66BB6A;
    font-weight: 700;
  }

  .page-content a {
    color: #4CAF50;
    text-decoration: none;
    font-weight: 600;
    transition: color 0.3s ease;
  }

  .page-content a:hover {
    color: #66BB6A;
    text-decoration: underline;
  }

  .feature-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 2rem;
    margin: 3rem 0;
  }

  .feature-card {
    background: linear-gradient(135deg, rgba(45, 50, 60, 0.8) 0%, rgba(35, 40, 50, 0.8) 100%);
    border: 1px solid rgba(76, 175, 80, 0.3);
    border-radius: 12px;
    padding: 2rem;
    transition: all 0.3s ease;
  }

  .feature-card:hover {
    border-color: #4CAF50;
    box-shadow: 0 8px 20px rgba(76, 175, 80, 0.2);
    transform: translateY(-4px);
  }

  .feature-card h3 {
    margin-top: 0;
  }

  .feature-card p {
    margin-bottom: 0;
  }

  .cta-section {
    background: linear-gradient(135deg, rgba(76, 175, 80, 0.15) 0%, rgba(0, 212, 255, 0.08) 100%);
    border: 2px solid rgba(76, 175, 80, 0.4);
    border-radius: 12px;
    padding: 3rem;
    text-align: center;
    margin: 4rem 0;
  }

  .cta-section h2 {
    margin-top: 0;
  }

  .btn-group {
    display: flex;
    gap: 1rem;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 2rem;
  }

  .btn {
    display: inline-block;
    padding: 14px 32px;
    background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
    color: white;
    text-decoration: none;
    font-weight: 600;
    border-radius: 8px;
    transition: all 0.3s ease;
    border: none;
    cursor: pointer;
    font-size: 1rem;
  }

  .btn:hover {
    background: linear-gradient(135deg, #45a049 0%, #3d8b40 100%);
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(76, 175, 80, 0.3);
  }

  .btn-secondary {
    background: rgba(76, 175, 80, 0.2);
    color: #4CAF50;
    border: 2px solid #4CAF50;
  }

  .btn-secondary:hover {
    background: rgba(76, 175, 80, 0.4);
  }

  /* Content backdrop for readability */
  .content-backdrop {
    background: linear-gradient(135deg, rgba(34, 40, 49, 0.85) 0%, rgba(45, 50, 60, 0.85) 100%);
    backdrop-filter: blur(10px);
    border-radius: 12px;
    margin: 0 auto;
    padding: 3rem;
    max-width: 1100px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
  }

  @media (max-width: 768px) {
    .content-backdrop {
      padding: 2rem;
      border-radius: 8px;
    }
  }

  /* Hide default page elements */
  .page-title {
    display: none;
  }

  .page {
    width: 100%;
    max-width: 100%;
    padding: 0;
  }

  .page__inner-wrap {
    max-width: 100%;
    margin: 0;
    padding: 0;
  }

  .wide {
    max-width: 100%;
  }
</style>

<div class="page-full-width">
  <div class="page-wrapper">
    <div class="content-backdrop">
      <div class="page-content">
        {{ content }}
      </div>
    </div>
  </div>
</div>
