<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }}</title>
  {% if page.description %}
    <meta name="description" content="{{ page.description }}">
  {% endif %}
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html {
      scroll-behavior: smooth;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #1a1f28;
      color: #eeeeee;
      line-height: 1.6;
      font-size: 16px;
    }

    .skip-link {
      position: absolute;
      left: 1rem;
      top: -100px;
      background: #ffffff;
      color: #111111;
      padding: 0.6rem 0.9rem;
      border-radius: 6px;
      font-weight: 700;
      text-decoration: none;
      z-index: 2000;
      transition: top 0.2s ease;
    }

    .skip-link:focus {
      top: 1rem;
    }
    
    /* Full width container for sections */
    .full-width-section {
      width: 100%;
      display: block;
    }
    
    /* Content wrapper (for constrained text areas) */
    .content-wrapper {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 40px;
    }
    
    @media (max-width: 768px) {
      .content-wrapper {
        padding: 0 20px;
      }
    }
    
    /* Typography scale - AGGRESSIVE for VC appeal */
    h1 {
      font-size: clamp(2.5rem, 7vw, 4.5rem);
      font-weight: 900;
      line-height: 1.1;
      letter-spacing: -0.02em;
      margin-bottom: 1.5rem;
      color: #ffffff;
      text-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }
    
    h2 {
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 1rem;
      color: #4CAF50;
    }
    
    h3 {
      font-size: clamp(1.3rem, 3vw, 1.8rem);
      font-weight: 700;
      color: #4CAF50;
      margin-bottom: 0.75rem;
    }
    
    p {
      font-size: clamp(1rem, 1.2vw, 1.1rem);
      line-height: 1.7;
      margin-bottom: 1.5rem;
      color: rgba(255,255,255,0.85);
    }
    
    /* Hero Section - FULL WIDTH, MASSIVE */
    .hero {
      width: 100%;
      margin-left: 0;
      height: 100vh;
      min-height: 600px;
      background: url('/assets/images/RHR%20Background%202.jpg') center/cover fixed no-repeat;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
      overflow: hidden;
      border-bottom: 3px solid rgba(76, 175, 80, 0.5);
    }
    
    .hero::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, rgba(34,40,49,0.6) 0%, rgba(68,80,94,0.6) 100%);
      z-index: 1;
    }
    
    @keyframes drift {
      0% { transform: translate(0, 0); }
      100% { transform: translate(100px, 100px); }
    }
    
    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 1000px;
      padding: 40px;
    }
    
    .hero h1 {
      margin-bottom: 2rem;
      font-size: clamp(1.7rem, 5.3vw, 3.3rem);
    }
    
    .hero-subtitle {
      font-size: clamp(1.2rem, 2vw, 1.5rem);
      line-height: 1.8;
      margin-bottom: 2rem;
      color: rgba(255,255,255,0.9);
      max-width: 800px;
      margin-left: auto;
      margin-right: auto;
    }
    
    /* Hero branding */
    .hero-content img {
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.4));
      transition: transform 0.3s ease;
    }
    
    .hero-brand {
      display: block;
      font-size: 1.3rem;
      font-weight: 700;
      color: #4CAF50;
      margin-bottom: 3rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 2px 6px rgba(0,0,0,0.5);
    }
    
    .hero-cta-group {
      display: flex;
      gap: 1.5rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 3rem;
    }

    .scroll-indicator {
      position: absolute;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      color: rgba(255,255,255,0.9);
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      animation: scrollBounce 1.8s ease-in-out infinite;
      transition: color 0.2s ease;
    }

    .scroll-indicator:hover {
      color: #4CAF50;
    }

    a:focus-visible,
    button:focus-visible,
    .btn:focus-visible,
    .card-button:focus-visible,
    .project-card:focus-visible,
    .sponsor-btn:focus-visible,
    .sticky-cta:focus-visible,
    .scroll-indicator:focus-visible {
      outline: 3px solid #8fd694;
      outline-offset: 3px;
      border-radius: 8px;
    }

    .scroll-text {
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }

    .scroll-indicator svg {
      width: 2.2rem;
      height: 2.2rem;
    }

    @keyframes scrollBounce {
      0%, 100% { transform: translateX(-50%) translateY(0);   opacity: 0.7; }
      50%       { transform: translateX(-50%) translateY(8px); opacity: 1;   }
    }
    
    .btn {
      padding: 18px 40px;
      font-size: 1.1rem;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      display: inline-block;
      box-shadow: 0 6px 20px rgba(0,0,0,0.3);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
      color: white;
    }
    
    .btn-primary:hover {
      background: linear-gradient(135deg, #45a049 0%, #3d8b40 100%);
      transform: translateY(-4px);
      box-shadow: 0 10px 30px rgba(76, 175, 80, 0.5);
    }
    
    .btn-secondary {
      background: rgba(255,255,255,0.15);
      color: white;
      border: 2px solid rgba(255,255,255,0.6);
    }
    
    .btn-secondary:hover {
      background: rgba(255,255,255,0.25);
      border-color: rgba(255,255,255,0.9);
      transform: translateY(-4px);
    }
    
    .hero-stats {
      display: flex;
      justify-content: center;
      gap: 3rem;
      flex-wrap: wrap;
      margin-top: 2rem;
    }
    
    .stat-item {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(76,175,80,0.3);
      padding: 2rem 2.5rem;
      border-radius: 12px;
      transition: all 0.3s ease;
    }
    
    .stat-item:hover {
      background: rgba(76,175,80,0.15);
      border-color: rgba(76,175,80,0.6);
      transform: translateY(-4px);
    }
    
    .stat-number {
      font-size: 2.8rem;
      font-weight: 900;
      color: #4CAF50;
      line-height: 1;
    }
    
    .stat-label {
      font-size: 0.95rem;
      color: rgba(255,255,255,0.7);
      margin-top: 0.5rem;
      font-weight: 600;
    }
    
    /* Section Styling */
    .rhr-section {
      width: 100%;
      padding: 80px 0;
      background: #1a1f28;
      border-top: 2px solid rgba(76, 175, 80, 0.2);
    }
    
    .rhr-section:nth-child(even) {
      background: #0f1419;
    }
    
    .rhr-section h2 {
      text-align: center;
      margin-bottom: 2rem;
    }
    
    .rhr-section-intro {
      text-align: center;
      max-width: 900px;
      margin: 0 auto 4rem;
      font-size: clamp(1rem, 1.3vw, 1.15rem);
      line-height: 1.8;
      color: rgba(255,255,255,0.8);
    }
    
    /* Grids */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 2.5rem;
      margin-bottom: 2rem;
    }
    
    .hardware-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
      gap: 3rem;
      margin: 4rem 0;
    }
    
    .advanced-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 2rem;
      margin: 4rem 0;
    }
    
    .blog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 2.5rem;
      margin: 4rem 0;
    }
    
    @media (max-width: 768px) {
      .grid, .hardware-grid, .advanced-grid, .blog-grid {
        grid-template-columns: 1fr;
      }
      
      .hero-stats {
        gap: 1.5rem;
      }
      
      .stat-item {
        padding: 1.5rem 2rem;
      }
    }
    
    /* Cards */
    .card {
      background: linear-gradient(135deg, rgba(45,50,60,1) 0%, rgba(35,40,50,1) 100%);
      border: 1px solid rgba(76, 175, 80, 0.4);
      border-radius: 12px;
      padding: 2rem;
      transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 8px 24px rgba(0,0,0,0.35);
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    
    .card:hover {
      transform: translateY(-12px);
      border-color: rgba(76, 175, 80, 0.8);
      box-shadow: 0 16px 40px rgba(76, 175, 80, 0.25);
    }
    
    .card h3 {
      margin-bottom: 1rem;
      color: #4CAF50;
    }
    
    .card p {
      flex-grow: 1;
      margin-bottom: 1.5rem;
      color: rgba(255,255,255,0.8);
      font-size: 1rem;
    }
    
    .card-button {
      display: inline-block;
      background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
      color: white;
      padding: 12px 24px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 700;
      transition: all 0.3s ease;
      border: none;
      cursor: pointer;
      align-self: flex-start;
    }
    
    .card-button:hover {
      background: linear-gradient(135deg, #45a049 0%, #3d8b40 100%);
      transform: translateX(4px);
    }
    
    .card-image {
      width: 100%;
      height: 220px;
      background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
      border-radius: 8px;
      margin-bottom: 1.5rem;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      color: white;
    }

    .card-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    
    .card-installs {
      font-size: 0.9rem;
      color: #4CAF50;
      font-weight: 700;
      margin-bottom: 1rem;
    }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
      font-size: 0.88rem;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.7);
    }

    .card-meta-separator {
      color: rgba(255, 255, 255, 0.45);
    }

    .card-docs-link {
      color: rgba(102, 187, 106, 0.95);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: color 0.2s ease, border-color 0.2s ease;
    }

    .card-docs-link:hover {
      color: #7bd286;
      border-bottom-color: #7bd286;
    }
    
    /* Project cards */
    .project-card {
      background: linear-gradient(135deg, rgba(45,50,60,0.8) 0%, rgba(35,40,50,0.8) 100%);
      border: 2px solid rgba(76, 175, 80, 0.4);
      border-radius: 12px;
      padding: 2.5rem 2rem;
      text-align: center;
      transition: all 0.35s ease;
      display: block;
      text-decoration: none;
      color: inherit;
      cursor: pointer;
    }
    
    .project-card:hover {
      border-color: rgba(0, 212, 255, 0.8);
      transform: translateY(-8px);
      box-shadow: 0 0 40px rgba(0, 212, 255, 0.25);
    }
    
    .project-icon {
      font-size: 3.5rem;
      margin-bottom: 1rem;
    }

    .project-icon img {
      width: min(220px, 100%);
      max-height: 72px;
      object-fit: contain;
      display: block;
      margin: 0 auto;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.35));
    }

    .project-icon img.makerpanel-logo {
      width: min(280px, 100%);
      max-height: 96px;
    }
    
    .project-card h3 {
      margin-bottom: 1rem;
    }
    
    .project-card p {
      margin-bottom: 0;
    }
    
    /* Blog cards */
    .blog-card {
      background: linear-gradient(135deg, rgba(45,50,60,1) 0%, rgba(35,40,50,1) 100%);
      border: 1px solid rgba(76, 175, 80, 0.4);
      border-radius: 12px;
      padding: 2rem;
      transition: all 0.35s ease;
      display: flex;
      flex-direction: column;
    }
    
    .blog-card:hover {
      transform: translateY(-8px);
      border-color: #4CAF50;
      box-shadow: 0 12px 32px rgba(76, 175, 80, 0.2);
    }
    
    .blog-date {
      font-size: 0.9rem;
      color: #4CAF50;
      font-weight: 700;
      margin-bottom: 0.75rem;
    }
    
    .blog-card h3 {
      margin-bottom: 1rem;
      color: white;
    }
    
    .blog-excerpt {
      flex-grow: 1;
      margin-bottom: 1.5rem;
      color: rgba(255,255,255,0.75);
      font-size: 1rem;
      line-height: 1.7;
    }
    
    .blog-read-more {
      color: #4CAF50;
      text-decoration: none;
      font-weight: 700;
      transition: all 0.2s ease;
    }
    
    .blog-read-more:hover {
      color: #66BB6A;
    }
    
    /* Sponsor section */
    .sponsor-container {
      background: linear-gradient(135deg, rgba(76, 175, 80, 0.15) 0%, rgba(0, 212, 255, 0.1) 100%);
      border: 2px solid rgba(76, 175, 80, 0.5);
      border-radius: 16px;
      padding: 4rem 3rem;
      text-align: center;
      margin: 4rem auto;
      max-width: 900px;
    }
    
    .sponsor-container h2 {
      margin-bottom: 1.5rem;
      font-size: clamp(2rem, 4vw, 2.8rem);
    }
    
    .sponsor-tagline {
      font-size: 1.2rem;
      color: rgba(255,255,255,0.85);
      margin-bottom: 2rem;
      line-height: 1.8;
    }
    
    .sponsor-buttons {
      display: flex;
      gap: 1.5rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    
    .sponsor-btn {
      padding: 14px 32px;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      display: inline-block;
    }
    
    .sponsor-btn-primary {
      background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
      color: white;
    }
    
    .sponsor-btn-primary:hover {
      background: linear-gradient(135deg, #45a049 0%, #3d8b40 100%);
      transform: translateY(-3px);
    }
    
    .sponsor-btn-secondary {
      background: rgba(76, 175, 80, 0.2);
      color: #4CAF50;
      border: 2px solid #4CAF50;
    }
    
    .sponsor-btn-secondary:hover {
      background: rgba(76, 175, 80, 0.35);
      transform: translateY(-3px);
    }
    
    /* Sticky CTA */
    .sticky-cta-group {
      position: fixed;
      bottom: 30px;
      right: 30px;
      display: none;
      gap: 0.75rem;
      z-index: 999;
    }

    .sticky-cta {
      background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
      color: white;
      padding: 14px 24px;
      border-radius: 50px;
      text-decoration: none;
      font-weight: 700;
      font-size: 1rem;
      box-shadow: 0 8px 24px rgba(76, 175, 80, 0.5);
      transition: all 0.3s ease;
      border: none;
      cursor: pointer;
      display: inline-block;
    }

    .sticky-cta.sticky-cta-sponsor {
      background: linear-gradient(135deg, #2e7d32 0%, #1b5e20 100%);
      border: 1px solid #7ac77f;
      color: #ffffff;
      box-shadow: 0 8px 24px rgba(0,0,0,0.35);
    }
    
    .sticky-cta:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 32px rgba(76, 175, 80, 0.6);
    }

    .sticky-cta.sticky-cta-sponsor:hover {
      box-shadow: 0 12px 32px rgba(0,0,0,0.45);
      border-color: rgba(255,255,255,0.6);
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
    
    @media (max-width: 768px) {
      .sticky-cta-group {
        bottom: 20px;
        right: 20px;
        gap: 0.5rem;
      }

      .sticky-cta {
        padding: 12px 20px;
        font-size: 0.95rem;
      }
      
      .rhr-section {
        padding: 50px 0;
      }
      
      .sponsor-container {
        padding: 2.5rem 1.5rem;
      }
    }
    
    /* Footer */
    .footer-section {
      background: linear-gradient(135deg, rgba(34, 40, 49, 0.95) 0%, rgba(50, 55, 65, 0.95) 100%);
      border-top: 2px solid rgba(76, 175, 80, 0.3);
      padding: 4rem 0;
      text-align: center;
      color: rgba(255,255,255,0.75);
      margin-top: 4rem;
    }
    
    .footer-section h3 {
      color: #4CAF50;
      margin-bottom: 1rem;
      font-size: 1.8rem;
    }
    
    .footer-section p {
      max-width: 700px;
      margin-left: auto;
      margin-right: auto;
      line-height: 1.8;
    }
    
    .footer-section a {
      color: #4CAF50;
      text-decoration: none;
      font-weight: 600;
    }
    
    .footer-section a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <main id="main-content">
    {{ content }}
  </main>
  
  <div class="sticky-cta-group" id="stickyCTAGroup">
    <a href="https://marketplace.visualstudio.com/items?itemName=Ranch-Hand-Robotics.rde-pack" class="sticky-cta" id="stickyCTA">⚡ Install RDE</a>
    <a href="https://github.com/sponsors/ranch-hand-robotics" class="sticky-cta sticky-cta-sponsor" id="stickySponsor" target="_blank" rel="noopener noreferrer">💚 Sponsor</a>
  </div>
  
  <script>
    window.addEventListener('scroll', () => {
      const ctaGroup = document.getElementById('stickyCTAGroup');
      if (window.scrollY > 800) {
        ctaGroup.style.display = 'flex';
      } else {
        ctaGroup.style.display = 'none';
      }
    });
  </script>
</body>
</html>
