# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: Ranch Hand Robotics – AI-Powered Tools & Robots for Farms, Fields, Forests
email: contact@ranchhandrobotics.com
description: >-
  Free VS Code/Cursor extensions for robot devs: digital twins, distributed debugging, AI bootstrapping. Plus real outdoor hardware, edge orchestrators, ATAK plugins, mesh nets, and cyberdecks.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://www.ranchhandrobotics.com" # the base hostname & protocol for your site, e.g. http://example.com
footer: "© 2025 Ranch Hand Robotics, LLC | Proudly bootstrapped in Seattle"

# SEO & Social
author:
  name: "Ranch Hand Robotics"
  twitter: "ooeygui"
twitter_username: "ooeygui"
social:
  name: Ranch Hand Robotics
  links:
    - "https://github.com/ranch-hand-robotics"
    - "https://www.youtube.com/@rh_robotics"
    - "https://x.com/rh_robotics"
head_scripts: []
footer_scripts: []
logo: "/assets/images/rhr_logo.svg"

# Favicon
favicon: "/favicon.svg"

#twitter_username: jekyllrb
github_username:  ranch-hand-robotics
github: [metadata]

# Build settings
remote_theme: "mmistakes/minimal-mistakes@4.26.2"
minimal_mistakes_skin: "dark"

# Collections for blog
collections:
  blog:
    output: true
    permalink: /blog/:title/
  
# Pagination
paginate: 10
paginate_path: /blog/page:num/

# Custom navigation
navigation:
  - title: "Home"
    url: "/"
  - title: "Extensions"
    url: "/#extensions"
  - title: "Hardware"
    url: "/#hardware"
  - title: "Advanced Projects"
    url: "/#advanced"
  - title: "Blog"
    url: "/blog/"
  - title: "About"
    url: "/about"
  - title: "Sponsor"
    url: "/#sponsor" 
plugins:
  - jekyll-feed
  - jekyll-remote-theme
  - jekyll-sitemap
  - jemoji
  - jekyll-github-metadata
  - jekyll-mentions
  - jekyll-optional-front-matter
  - jekyll-paginate
  - jekyll-sass-converter
  - jekyll-include-cache
  - jekyll-seo-tag

repository: ranchhandrobotics/ranchhandrobotics.github.io

defaults:
  - scope:
      path: ""
      type: "blog"
    values:
      layout: "blog-post"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: "_pages"
      type: "pages"
    values:
      layout: "page"
  - scope:
      path: "_sass"
      type: "sass"
    values:
      layout: "sass"

markdown: kramdown
highlighter: rouge
lsi: false
atom_feed:
  hide: true

kramdown:
  input: GFM
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: true


include:
  - _pages

whitelist:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-sitemap
  - jemoji
  - jekyll-github-metadata
  - jekyll-mentions
  - jekyll-optional-front-matter
  - jekyll-paginate
  - jekyll-sass-converter
  - jekyll-include-cache



# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
